<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- 꼬리 -->
  <path d="M 100 200 Q 160 220 170 180 Q 180 150 155 140" stroke="#F5A623" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- 몸통 -->
  <ellipse cx="100" cy="185" rx="55" ry="60" fill="#F5A623"/>

  <!-- 배 (밝은 색) -->
  <ellipse cx="100" cy="195" rx="30" ry="38" fill="#FDE8C8"/>

  <!-- 왼쪽 다리 -->
  <ellipse cx="72" cy="238" rx="16" ry="10" fill="#F5A623"/>
  <!-- 왼쪽 발 -->
  <ellipse cx="72" cy="246" rx="16" ry="7" fill="#FDE8C8"/>

  <!-- 오른쪽 다리 -->
  <ellipse cx="128" cy="238" rx="16" ry="10" fill="#F5A623"/>
  <!-- 오른쪽 발 -->
  <ellipse cx="128" cy="246" rx="16" ry="7" fill="#FDE8C8"/>

  <!-- 왼쪽 팔 -->
  <ellipse cx="52" cy="185" rx="12" ry="28" fill="#F5A623" transform="rotate(-15 52 185)"/>
  <!-- 왼쪽 손 -->
  <circle cx="42" cy="210" r="12" fill="#F5A623"/>

  <!-- 오른쪽 팔 -->
  <ellipse cx="148" cy="185" rx="12" ry="28" fill="#F5A623" transform="rotate(15 148 185)"/>
  <!-- 오른쪽 손 -->
  <circle cx="158" cy="210" r="12" fill="#F5A623"/>

  <!-- 머리 -->
  <circle cx="100" cy="100" r="62" fill="#F5A623"/>

  <!-- 왼쪽 귀 -->
  <polygon points="45,55 30,15 70,45" fill="#F5A623"/>
  <polygon points="48,52 36,22 66,45" fill="#FFB6C1"/>

  <!-- 오른쪽 귀 -->
  <polygon points="155,55 170,15 130,45" fill="#F5A623"/>
  <polygon points="152,52 164,22 134,45" fill="#FFB6C1"/>

  <!-- 얼굴 밝은 부분 -->
  <ellipse cx="100" cy="115" rx="38" ry="32" fill="#FDE8C8"/>

  <!-- 왼쪽 눈 -->
  <ellipse cx="80" cy="95" rx="10" ry="11" fill="#fff"/>
  <circle cx="82" cy="96" r="6" fill="#333"/>
  <circle cx="84" cy="93" r="2" fill="#fff"/>

  <!-- 오른쪽 눈 -->
  <ellipse cx="120" cy="95" rx="10" ry="11" fill="#fff"/>
  <circle cx="122" cy="96" r="6" fill="#333"/>
  <circle cx="124" cy="93" r="2" fill="#fff"/>

  <!-- 코 -->
  <polygon points="100,108 95,115 105,115" fill="#FF8FA3"/>

  <!-- 입 -->
  <path d="M 95 115 Q 100 122 105 115" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 122 Q 93 128 88 125" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 122 Q 107 128 112 125" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 수염 왼쪽 -->
  <line x1="60" y1="112" x2="88" y2="115" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="120" x2="88" y2="119" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="128" x2="90" y2="124" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 수염 오른쪽 -->
  <line x1="140" y1="112" x2="112" y2="115" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142" y1="120" x2="112" y2="119" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="138" y1="128" x2="110" y2="124" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 볼 홍조 -->
  <ellipse cx="72" cy="118" rx="12" ry="7" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="128" cy="118" rx="12" ry="7" fill="#FFB6C1" opacity="0.6"/>

  <!-- 이마 줄무늬 -->
  <path d="M 88 68 Q 100 60 112 68" stroke="#E8941A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 84 78 Q 100 68 116 78" stroke="#E8941A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
